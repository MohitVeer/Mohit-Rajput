[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Clean URLs: /index.html is just an alias of /.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Client-side (React) routes — serve the app shell with a 200.
[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

# Everything else is a real 404 (not a "soft 404" that returns 200 + the home
# page). Existing files (assets, images, PDFs, robots.txt, ...) are served
# first, because these rules aren't forced.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
